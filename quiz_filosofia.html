<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Quiz de Filosofía – El mundo de Sofía (Capítulo 1)</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5;}
    .question {margin-bottom: 1.5rem;}
    .options label {display: block; margin-left: 1.5rem;}
    .result {font-weight: bold; margin-top: 2rem;}
    button {padding: 0.5rem 1rem; font-size: 1rem;}
  </style>
</head>
<body>
  <h1>Quiz de Filosofía – El mundo de Sofía (Capítulo 1)</h1>
  <div id="quiz"></div>
  <button id="checkBtn">Comprobar respuestas</button>
  <div class="result" id="result"></div>

  <script>
    // Quiz data (embedded) – 8 MC + 2 TF (filosofía básica)
    const questions = [
      {
        type: "multiple",
        question: "¿Cómo describe Sofía el cerebro humano al compararlo con una máquina?",
        options: ["A) Igual que un sofisticado ordenador", "B) Más simple que una máquina", "C) No lo menciona", "D) Igual que una piedra"],
        answer: "A"
      },
      {
        type: "multiple",
        question: "¿Qué nombre le había dado el padre de Sofía a su hija antes de decidir llamarla Sofía?",
        options: ["A) Anne Knutsen", "B) Synnove", "C) Hilde", "D) Maria"],
        answer: "B"
      },
      {
        type: "multiple",
        question: "¿Cuál es el nombre del gato de Sofía?",
        options: ["A) Misi", "B) Sherekan", "C) Felix", "D) Tigre"],
        answer: "B"
      },
      {
        type: "multiple",
        question: "¿Qué tipo de carta recibe Sofía al comienzo de la historia?",
        options: ["A) Una carta de su padre", "B) Una carta sin remitente ni sello", "C) Un paquete", "D) Un correo electrónico"],
        answer: "B"
      },
      {
        type: "multiple",
        question: "¿Cuál es la primera pregunta escrita en la nota que Sofía encuentra?",
        options: ["A) ¿De dónde vienes?", "B) ¿Quién eres?", "C) ¿Qué haces aquí?", "D) ¿Cuál es tu nombre?"],
        answer: "B"
      },
      {
        type: "multiple",
        question: "¿Qué actividad hace Sofía antes de leer la carta?",
        options: ["A) Se pone la mochila", "B) Prepara comida para el gato", "C) Se sienta a hacer los deberes", "D) Se baña"],
        answer: "C"
      },
      {
        type: "multiple",
        question: "¿Qué animal es mencionado como parte de la “colección de animales” de la familia?",
        options: ["A) Un perro", "B) Un pez dorado llamado Flequillo de Oro", "C) Un hámster", "D) Un loro"],
        answer: "B"
      },
      {
        type: "multiple",
        question: "¿Qué pregunta escribe la segunda carta que Sofía recibe?",
        options: ["A) ¿De dónde viene el mundo?", "B) ¿Cómo te llamas?", "C) ¿Qué haces?", "D) ¿Cuál es tu color favorito?"],
        answer: "A"
      },
      {
        type: "truefalse",
        question: "Sofía recibe una carta de su padre con sello y remitente.",
        options: ["Verdadero", "Falso"],
        answer: "F"
      },
      {
        type: "truefalse",
        question: "El Callejón se encuentra dentro del jardín y es un espacio secreto que Sofía usa cuando está triste o feliz.",
        options: ["Verdadero", "Falso"],
        answer: "V"
      }
    ];

    function renderQuiz() {
      const quizDiv = document.getElementById('quiz');
      questions.forEach((q, idx) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        const title = document.createElement('p');
        title.innerHTML = `<strong>${idx + 1}. ${q.question}</strong>`;
        qDiv.appendChild(title);
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        if (q.type === 'multiple') {
          q.options.forEach((opt, i) => {
            const id = `q${idx}_opt${i}`;
            const label = document.createElement('label');
            label.htmlFor = id;
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${idx}`;
            radio.id = id;
            radio.value = String.fromCharCode(65 + i); // A, B, C, D
            label.appendChild(radio);
            label.append(' ' + opt);
            optsDiv.appendChild(label);
          });
        } else { // true/false
          ['V', 'F'].forEach(v => {
            const id = `q${idx}_tf_${v}`;
            const label = document.createElement('label');
            label.htmlFor = id;
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${idx}`;
            radio.id = id;
            radio.value = v;
            const txt = v === 'V' ? 'Verdadero' : 'Falso';
            label.appendChild(radio);
            label.append(' ' + txt);
            optsDiv.appendChild(label);
          });
        }
        qDiv.appendChild(optsDiv);
        quizDiv.appendChild(qDiv);
      });
    }

    document.getElementById('checkBtn').addEventListener('click', () => {
      let score = 0;
      questions.forEach((q, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        if (sel && sel.value === q.answer) score++;
      });
      const total = questions.length;
      document.getElementById('result').innerText = `Puntuación: ${score} / ${total}`;
    });

    // Initialise
    renderQuiz();
  </script>
</body>
</html>
